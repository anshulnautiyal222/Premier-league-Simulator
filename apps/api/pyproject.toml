[project]
name = "gafferdex-api"
version = "0.1.0"
description = "FastAPI market calculation and valuation engine for GafferDex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.4",
    "supabase>=2.4.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
